<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Flowlyne</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <h1>Flowlyne</h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="services.html">Find Services</a>
                <a href="login.html">Login</a>
                <a href="register.html">Sign Up</a>
            </div>
        </nav>
    </header>

    <main style="padding: 2rem; background: #f8f9fa; min-height: calc(100vh - 140px);">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">Welcome Back</h2>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                    Login
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem;">
                Don't have an account? <a href="register.html" style="color: #3498db;">Sign up here</a>
            </p>

            <div style="margin-top: 2rem; padding: 1rem; background: #e8f4fd; border-radius: 5px; border-left: 4px solid #3498db;">
                <h4 style="color: #2c3e50; margin-bottom: 0.5rem;">Demo Accounts:</h4>
                <p style="margin: 0.3rem 0; font-size: 0.9rem;"><strong>Company:</strong> company@demo.com / password123</p>
                <p style="margin: 0.3rem 0; font-size: 0.9rem;"><strong>Provider:</strong> provider@demo.com / password123</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Flowlyne. Connecting businesses across Egypt.</p>
    </footer>

    <script>
        // Add demo accounts for testing
        document.addEventListener('DOMContentLoaded', function() {
            let users = JSON.parse(localStorage.getItem('flowlyne_users')) || [];
            
            // Add demo accounts if they don't exist
            const demoAccounts = [
                {
                    id: 1,
                    name: 'Demo Company',
                    email: 'company@demo.com',
                    password: 'password123',
                    type: 'company',
                    company: 'Demo Corp',
                    createdAt: new Date().toISOString()
                },
                {
                    id: 2,
                    name: 'Demo Provider',
                    email: 'provider@demo.com',
                    password: 'password123',
                    type: 'provider',
                    company: 'Web Solutions Pro',
                    services: 'Web Development',
                    description: 'Professional web development services with 5+ years experience in React, Node.js, and modern web technologies.',
                    createdAt: new Date().toISOString()
                }
            ];
            
            demoAccounts.forEach(demo => {
                if (!users.find(u => u.email === demo.email)) {
                    users.push(demo);
                }
            });
            
            localStorage.setItem('flowlyne_users', JSON.stringify(users));
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
